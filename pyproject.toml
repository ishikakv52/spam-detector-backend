[project]
name = "spam-detector-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.0.6",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "django-cors-headers==4.4.0",
    "psycopg2-binary>=2.9.11",
    "python-decouple==3.8",
    "groq>=0.11.0"
]

[tool.vercel]
entrypoint = "config.wsgi:application"
